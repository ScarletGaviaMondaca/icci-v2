<div class="exalumnos">
      <h1 class="titulo">Exalumnos</h1>

    <!-- BOTONES PARA IMPORTAR Y EXPORTAR EXALUMNOS -->
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div class="d-flex align-items-end gap-2">
            <button *ngIf="auth.esAdmin()" class="opcion btn" (click)="toggleCarga()">
                Subir archivo
            </button>
            <div *ngIf="mostrarCarga" class="mt-3 p-3 border rounded bg-light">
                <label class="btn carga mb-0">
                    Seleccionar CSV
                    <input hidden type="file" accept=".csv" (change)="importar($event)">
                </label>
            </div>
            <button class="opcion btn" (click)="exportar()">
                Exportar lista
            </button>
            <div>
                <label class="form-label mb-0">
                    Formato
                </label>
                <select [(ngModel)]="tipoExport" class="form-select">
                    <option value="csv">CSV</option>
                    <option value="excel">Excel</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>
        </div>
    </div>
    <div class="table-wrapper">
        <table  class="table table-striped table-bordered mt-3" style="margin-top:0!important">
            <thead>
                <tr>
                <th></th>
                <th>Nombre
                    <input class="form-control form-control-sm mt-1" [(ngModel)]="filtroNombre" (ngModelChange)="paginaActual=1"> 
                </th>
                <th>RUT
                    <input class="form-control form-control-sm mt-1" [(ngModel)]="filtroRut" (ngModelChange)="paginaActual=1">
                </th>
                <th>Año de Ingreso
                    <input class="form-control form-control-sm mt-1" [(ngModel)]="filtroAnio" (ngModelChange)="paginaActual=1">
                </th>
                <th>Año de Titulación
                    <input class="form-control form-control-sm mt-1" [(ngModel)]="filtroAnioTitulacion" (ngModelChange)="paginaActual=1">
                </th>
                <th>Carrera</th>
                <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let ex of datosPaginados; let i = index"> 
                            
                <td>{{ numeroFila(i) }}</td>
                <td>{{ ex.nombres }} {{ ex.paterno }}</td>
                <td>{{ ex.rut }}</td>
                <td>{{ ex.anio_ingreso }}</td>
                <td>{{ ex.anio_titulacion }}</td>
                <td>{{ ex.nombre_carrera }}</td>
                <td class="text-center">
                    <button class="accion" (click)="verAlumno(ex)">
                    👁️ </button>

                    <button class="accion" (click)="editarAlumno(ex)" >
                    ✏️ </button>

                    <button class="accion" (click)="eliminarAlumno(ex.id)">
                    🗑️ </button>
                </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- Paginación -->
    <div *ngIf="filtrarDatos().length > 0" class="d-flex justify-content-between align-items-center mt-3">
        <!-- Info -->
        <div class="small text-muted">
            Mostrando {{ desdeRegistro }} - {{ hastaRegistro }} de {{ totalFiltrados }}
        </div>

    <!-- Controles  de paginacion -->
    <nav class="paginacion">
            <ul class="pagination mb-0">
                <li class="page-item" [class.disabled]="paginaActual === 1">
                    <button class="page-link" (click)="cambiarPagina(paginaActual - 1)" [disabled]="paginaActual === 1">
                        Anterior
                    </button>
                </li>
                <li class="page-item"
                    *ngFor="let p of paginasArray(); trackBy: trackByPagina"
                    [class.active]="p === paginaActual">
                    <button class="page-link" (click)="cambiarPagina(p)">{{ p }}</button>
                </li>
                <li class="page-item" [class.disabled]="paginaActual === totalPaginas()">
                    <button class="page-link" (click)="cambiarPagina(paginaActual + 1)" [disabled]="paginaActual === totalPaginas()">
                        Siguiente
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</div>
