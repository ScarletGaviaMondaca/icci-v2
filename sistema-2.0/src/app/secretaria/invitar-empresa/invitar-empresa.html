<div class="fondo">
  <h1 class="titulo">Invitar Empresa</h1>
  <p class="text-muted">Envía por correo un link de registro de un solo uso para que una empresa cree su cuenta en el sistema.</p>

  <div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="row">
    <div class="col-md-12">
      <div class="estado-actual" style="max-width:480px">
        <div class="mb-3">
          <label class="form-label">Correo del empleador</label>
          <input type="email" class="form-control form-control-sm"
                 [(ngModel)]="correoToken" placeholder="supervisor@empresa.cl">
        </div>
        <button class="btn btn-sm btn-warning"
                [disabled]="generandoToken || !correoToken"
                (click)="generarTokenEmpleador()">
          {{ generandoToken ? 'Enviando...' : '📧 Enviar invitación por correo' }}
        </button>

        <div *ngIf="tokenGenerado" class="mt-3">
          <label class="form-label fw-bold">Link de registro (respaldo):</label>
          <div class="input-group">
            <input type="text" class="form-control form-control-sm" [value]="tokenGenerado" readonly>
            <button class="btn btn-sm btn-outline-secondary" (click)="copiarToken()">📋 Copiar</button>
          </div>
          <small class="text-muted">El correo ya fue enviado automáticamente. Usa este link solo si el empleador no lo recibe — tiene un solo uso.</small>
        </div>
      </div>
    </div>
  </div>
</div>
