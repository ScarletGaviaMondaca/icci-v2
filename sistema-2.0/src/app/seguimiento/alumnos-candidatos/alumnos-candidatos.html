<div class="fondo container mt-4">
  <h3 class="titulo">Lista de Alumnos Candidatos</h3>
<div class="d-flex justify-content-between align-items-center mb-3">
  <!-- Filtro especial -->
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="filtroEspecial"
           [(ngModel)]="soloEspeciales"
           (ngModelChange)="paginaActual = 1">
    <label class="form-check-label" for="filtroEspecial">
      Solo alumnos especiales
    </label>
  </div>
  <div class="d-flex gap-2">
    <!-- Botón agregar especial — solo admin y secretaria -->
    <button class="agregar btn btn-sm btn-outline-warning"
            routerLink="/seguimiento/agregar-especial">
      ➕ Ingreso Especial
    </button>
    <button class="carga agregar btn-sm btn-outline-primary" *ngIf="auth.esSecretaria() || auth.esAdmin()" (click)="toggleCarga()">
      📂 Subir lista
    </button>
  </div>
</div>

<!-- Subpanel subir archivo -->
<div *ngIf="mostrarCarga" class="mt-2 mb-3 p-3 border rounded bg-light">
  <div class="d-flex align-items-center gap-3 flex-wrap">
    <label class="carga btn btn-sm mb-0">
      Seleccionar CSV
      <input type="file" hidden accept=".csv" (change)="importarCSV($event)">
    </label>
    <span *ngIf="nombreArchivo" class="badge bg-success">{{ nombreArchivo }}</span>
    <button class="carga btn btn-sm" (click)="descargarPlantilla()">📄 Descargar plantilla</button>
  </div>
  <span *ngIf="estadoSubida" class="small d-block mt-2"
        [class.text-success]="estadoSubida.includes('Importados')"
        [class.text-danger]="estadoSubida.includes('❌')">
    {{ estadoSubida }}
  </span>
</div>
  <!-- Tabla de alumnos con filtros  -->
  <div class="table-wrapper">
  <table class="table table-bordered table-striped text-center">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>RUT
          <input type="text" class="form-control form-control-sm"
                  [(ngModel)]="filtroRut" (ngModelChange)="paginaActual=1">
        </th>
        <th>Nombre
          <input type="text" class="form-control form-control-sm"
                  [(ngModel)]="filtroNombre" (ngModelChange)="paginaActual=1">
        </th>
        <th>Apellidos
          <input type="text" class="form-control form-control-sm"
                  [(ngModel)]="filtroApellidos" (ngModelChange)="paginaActual=1">
        </th>
        <th>Práctica 1
          <input class="form-check-input" type="checkbox" 
           [(ngModel)]="filtroPractica1" 
           (ngModelChange)="paginaActual=1"
           id="chkP1">
        </th>
          
        <th>Práctica 2 
          <input class="form-check-input" type="checkbox" 
           [(ngModel)]="filtroPractica2" 
           (ngModelChange)="paginaActual=1"
           id="chkP2">
        </th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr  *ngFor="let alumno of alumnosPaginados(); let i = index">
        <td> {{ ((paginaActual - 1) * elementosPorPagina) + i + 1 }} </td>
        <td>{{ alumno.rut | rutFormato }}</td>
        <td>{{ alumno.nombre }}
          <span *ngIf="alumno.tipo === 'especial'"
                class="badge bg-warning text-dark ms-1">
            Especial
          </span>
        </td>
        <td>{{ alumno.apellidos }}</td>
        <td>
            <button 
                class="btn btn-success btn-sm"
                *ngIf="puedePractica1(alumno)"
                (click)="iniciarPractica(alumno, 1)"
                >
                +
            </button>
        </td>
        <td>
            <button 
                class="btn btn-primary btn-sm"
                *ngIf="puedePractica2(alumno)"
                (click)="iniciarPractica(alumno, 2)"
                >
                +
            </button>
        </td>
        <td>
          <button class="btn btn-primary btn-sm me-2" (click)="verAlumno(alumno)">Ver</button>
        </td>
      </tr>
    </tbody>
  </table>
  </div>
  <div *ngIf="filtrarDatos().length > 0" class="d-flex justify-content-between align-items-center mt-3">
  <nav class="paginacion">
    <ul class="pagination mb-0">

      <li class="page-item" [class.disabled]="paginaActual === 1">
          <button class="page-link" (click)="cambiarPagina(paginaActual - 1)" [disabled]="paginaActual === 1">
          Anterior
          </button>
      </li>

      <li class="page-item"
          *ngFor="let p of paginasArray(); trackBy: trackByPagina"
          [class.active]="p === paginaActual">
          <button class="page-link" (click)="cambiarPagina(p)">
          {{ p }}
          </button>
      </li>

      <li class="page-item" [class.disabled]="paginaActual === totalPaginas()">
          <button class="page-link" (click)="cambiarPagina(paginaActual + 1)" [disabled]="paginaActual === totalPaginas()">
          Siguiente
          </button>
      </li>
    </ul>
  </nav>
  </div>
</div>
